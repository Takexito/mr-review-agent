# Настройки сервиса (ADR 0004). Путь — переменная SERVICE_CONFIG, по умолчанию /config/service.yaml.
# Секреты здесь не хранятся: поля-токены принимают только ссылку secret:NAME на переменную окружения
# (.env), открытый текст — ошибка запуска. Неизвестный ключ — тоже ошибка: опечатка не пройдёт молча.

server:
  port: 8080
  logLevel: info
  # Секрет, который GitLab шлёт в X-Gitlab-Token. Сгенерируй: openssl rand -hex 32
  webhookSecret: secret:WEBHOOK_SECRET
  redisUrl: redis://redis:6379
  # Если сиат подписки общий с разработчиком и rate-limit учащается — снижай до 1.
  queueConcurrency: 2

gitlab:
  host: https://gitlab.com
  # Необязательно: токен только для clone/fetch (read_repository). Пусто = токен бота codex.
  # cloneToken: secret:GITLAB_CLONE_TOKEN

git:
  # Держи кэш вне TMPDIR: в workspace-write песочница агента пишет в TMPDIR.
  cacheDir: /data/repos

review:
  # Порог переключения inline → agentic (не размер усечения).
  maxDiffBytes: 400000
  maxDiffLines: 20000
  # Выше порога (символов) прямые цели уходят агенту файлами с оглавлением в промпте.
  targetsInlineMaxChars: 60000
  # Общий лимит (мс) на вызовы prefetch всех прямых целей джобы: зависший сервер коннектора не держит её дольше.
  prefetchTimeoutMs: 300000
  # Дочитывание пропущенных агентом файлов: прогонов на ось (0 — выкл.) и файлов в прогоне.
  coverageFollowup: { runs: 5, batch: 40 }

engines:
  codex:
    # Бот-аккаунт: username — то, что тегают (@codex); token — PAT со scope api.
    bot: { username: codex, token: secret:GITLAB_TOKEN }
    home: /data/codex
    # model: gpt-5
    # reasoning: high
  # Секция есть — движок включён.
  # claude:
  #   bot: { username: claude_bot, token: secret:CLAUDE_GITLAB_TOKEN }
  #   # Годовой OAuth-токен подписки: `claude setup-token`.
  #   oauthToken: secret:CLAUDE_CODE_OAUTH_TOKEN
  #   model: sonnet

# Готовые MCP-серверы (ADR 0002). Имя — латиница, цифры, дефис. Ровно одно из command (stdio)
# или url (http); токены в env/headers — через secret:NAME и только на чтение: запрет записи
# держит сама система, а tools лишь сужает выдачу агенту (без tools открыт весь сервер).
# hint попадает в промпт. Коннектор доступен проекту, только если его перечисляет профиль.
# prefetch — как БОТ скачивает прямую цель до запуска движка (ADR 0003): инструмент и шаблон
# аргументов; {key} — PRJ-137 / #34, {number} — 137 / 34, {project} — проект задачи GitLab или MR.
# Ответ кладётся как есть; привязанные документы — то, что вернул этот же инструмент.
connectors: {}
#  gitlab:
#    command: npx
#    args: [-y, "@zereight/mcp-gitlab@2.3.22"]
#    env:
#      GITLAB_PERSONAL_ACCESS_TOKEN: secret:GITLAB_MCP_TOKEN
#      GITLAB_API_URL: https://gitlab.com/api/v4
#      GITLAB_PERMISSION_MODE: readonly
#    tools: [get_issue, list_issue_discussions, list_issues, get_merge_request, mr_discussions, get_file_contents, get_repository_tree]
#    hint: Задачи (#34), чужие MR (!12), файлы и вложения GitLab по ссылкам из требований и тредов.
#    prefetch: { tool: get_issue, arguments: { project_id: "{project}", issue_iid: "{number}" } }
#  linear:
#    command: npx
#    args: [-y, "@tacticlaunch/mcp-linear@1.4.5"]
#    # У сервера есть пишущие инструменты и нет режима только чтения: ключ обязан быть Read-only.
#    env: { LINEAR_API_TOKEN: secret:LINEAR_MCP_TOKEN }
#    tools: [linear_getIssueById, linear_searchIssues, linear_getComments, linear_getAttachments, linear_getDocumentById, linear_searchDocuments]
#    hint: Задачи Linear по ключу вида PRJ-137 и их документы.
#    prefetch: { tool: linear_getIssueById, arguments: { id: "{key}" } }
#    # Картинки этих хостов в тексте прямых целей коннектора бот качает с этими заголовками (только https,
#    # за редиректом заголовки не идут). Без attachments такие картинки агенту недоступны.
#    attachments: { hosts: [uploads.linear.app], headers: { Authorization: secret:LINEAR_MCP_TOKEN } }

# Профили проектов: glob по path_with_namespace (* — внутри сегмента, ** — любые сегменты).
# Побеждает первый совпавший; проект без профиля бот игнорирует.
profiles:
  - name: acme
    projects: [acme/android-app]
    # Какие боты отвечают в проекте. Пусто = все настроенные движки.
    # engines: [codex]
    # Модель и усилие для проектов профиля — поверх engines.<движок>.model/reasoning; у claude только model.
    # Значения не проверяются при запуске: опечатка проявится падением прогона.
    # models: { codex: { model: gpt-6.1-sol, reasoning: xhigh }, claude: { model: opus } }
    # connectors: [linear, gitlab]
    # Прямые цели MR: префикс ключа → коннектор с prefetch; "#" — задачи GitLab (#34, ветка 34-…).
    # Ищутся в заголовке MR, имени ветки, строках Closes/Fixes/Resolves/Refs и аргументе `spec`.
    # Без issueKeys ось постановки не запускается.
    # issueKeys: { PRJ: linear, "#": gitlab }
    # Сеть у самого агента: по умолчанию выкл.; cliTools — только вместе с ней.
    # agentNetwork: false
    # Команда или {name, env}: env уходит в окружение самого агента — токен в нём агент может увести,
    # поэтому только на чтение. PATH, HOME, CODEX_HOME и т.п. бот задаёт сам — их переопределить нельзя.
    # cliTools: [{ name: glab, env: { GITLAB_TOKEN: secret:GLAB_READ_TOKEN, GITLAB_HOST: gitlab.com } }]
    # Смежные репозитории (ADR 0005): полный чекаут рядом с worktree MR, только для чтения агентом.
    # ref — ветка; без него — ветка по умолчанию; same-branch — ветка с именем ветки MR, если есть.
    # Боту нужен доступ ≥Reporter; первый клон большого репозитория занимает минуты.
    # Какие смежные репозитории может добавить .review.yml репозитория (glob как в projects).
    # Пусто — не может. Коннекторы .review.yml только сужает, отдельного списка для них нет.
    # relatedAllowlist: ["acme/**"]
    related:
      - project: acme/docs
        hint: Документация и API-контракты — источник истины.
