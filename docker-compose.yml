# Самодостаточный запуск mr-review-agent: сервис + собственный Redis.
# НЕ использует общую инфру (shared-net / backend-Redis / Caddy). Публикацию
# вебхука наружу решаем отдельно (туннель cloudflared/ngrok или отдельный прокси).

services:
  codex-bot:
    build: .
    image: mr-review-agent:latest
    container_name: mr-review-agent
    restart: unless-stopped
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379
      CODEX_HOME: /data/codex
      REPOS_CACHE_DIR: /data/repos
    # Песочница codex на Linux делается bubblewrap, а тому нужны непривилегированные
    # user namespaces, которые дефолтный seccomp-профиль Docker запрещает. Без этого
    # bwrap падает («No permissions to create new namespace»), и codex либо выполняет
    # команды БЕЗ песочницы (read-only), либо не выполняет вовсе (workspace-write).
    # То есть до этой строки seccomp был включён, а песочница агента — нет.
    # Меняем формальный слой на реально работающий: минимальный вариант, без
    # cap_add SYS_ADMIN и без privileged (оба тоже чинят bwrap, но дают больше прав).
    security_opt:
      - seccomp:unconfined
    ports:
      # Слушаем только на localhost — наружу отдаём через туннель/прокси.
      - "127.0.0.1:8080:8080"
    volumes:
      - codex-home:/data/codex   # сюда кладём auth.json переиспользованного сиата
      - repos-cache:/data/repos  # bare-кэш клонов
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: mr-review-agent-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data

volumes:
  codex-home:
  repos-cache:
  redis-data:
